[package]
name = "thoughtforge"
version = "1.3.2"
description = "ThoughtForge - Local-First AI Planning Assistant"
authors = ["Lars Roettig"]
edition = "2021"
default-run = "thoughtforge"

[lib]
name = "thoughtforge_lib"
crate-type = ["rlib"]

[[bin]]
name = "thoughtforge"
path = "src/main.rs"

[[bin]]
name = "vaultmind-mcp"
path = "src/bin/mcp.rs"

[dependencies]
axum = { version = "0.8.9", features = ["tokio"] }
libc = "0.2"
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"
open = "5"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
url = "2"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
clap = { version = "4.6.1", features = ["derive"] }
turbovec = "0.2"
blas-src = { version = "0.14", features = ["accelerate"] }
sha2 = "0.11"
hex = "0.4"
bm25 = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
