[package]
name = "thoughtforge"
version = "1.3.0"
description = "ThoughtForge - Local-First AI Planning Assistant"
authors = ["Lars Roettig"]
edition = "2021"
default-run = "thoughtforge"

[lib]
name = "thoughtforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultmind-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "7", features = ["macos_fsevent"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
url = "2"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
clap = { version = "4.6.1", features = ["derive"] }
axum = { version = "0.8.9", features = ["tokio"] }
turbovec = "0.2"
blas-src = { version = "0.10", features = ["accelerate"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
