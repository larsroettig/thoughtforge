name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ThoughtForge
        2. Go to ...
        3. Click ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ThoughtForge version
      placeholder: "e.g. 1.3.0-beta.1 (shown in Settings → About)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: macOS version
      options:
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - macOS 13 Ventura
        - Other
    validations:
      required: true

  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: "Apple Silicon (M-series) or Intel"
    validations:
      required: true

  - type: textarea
    id: lmstudio
    attributes:
      label: LM Studio setup (if AI-related)
      description: Model name, LM Studio version, and whether the local server is running.
      placeholder: "Model: qwen2.5-14b, LM Studio 0.3.x, server running on port 1234"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Open the DevTools console (⌘⌥I) and paste any errors here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported before
          required: true
        - label: I'm using the latest release
          required: false
