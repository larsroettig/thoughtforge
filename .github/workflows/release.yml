name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.3.1)"
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest    # Apple Silicon (M-series)
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-13        # Intel
            target: x86_64-apple-darwin
            arch: x86_64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Frontend MUST build before Cargo — rust-embed requires dist/ to exist
      - name: Build frontend
        run: bun run build

      - name: Build binaries
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Package
        run: |
          REF="${{ github.ref_name }}"
          TAG="${REF:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          OUTDIR="dist-pkg"
          TARBALL="thoughtforge-${TAG}-${{ matrix.arch }}.tar.gz"
          mkdir -p "$OUTDIR"
          # Copy binaries and frontend alongside each other so the binary can find dist/
          mkdir -p staging/dist
          cp src-tauri/target/${{ matrix.target }}/release/thoughtforge staging/
          cp src-tauri/target/${{ matrix.target }}/release/vaultmind-mcp staging/
          cp -r dist/. staging/dist/
          tar -czf "$OUTDIR/$TARBALL" -C staging .
          # sha256 — macOS ships shasum, Linux ships sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$OUTDIR/$TARBALL" | awk '{print $1}' > "$OUTDIR/$TARBALL.sha256"
          else
            shasum -a 256 "$OUTDIR/$TARBALL" | awk '{print $1}' > "$OUTDIR/$TARBALL.sha256"
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          files: |
            ${{ env.OUTDIR }}/*.tar.gz
            ${{ env.OUTDIR }}/*.sha256

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.OUTDIR }}/*.tar.gz
